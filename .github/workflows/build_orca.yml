on:
    workflow_call:
      inputs:
        cache-key:
          required: true
          type: string
        cache-path:
          required: true
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string

jobs:
  build_orca:
    name: Build OrcaMCP
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:
      ORCA_UPDATER_SIG_KEY: ${{ secrets.ORCA_UPDATER_SIG_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v4
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version
          
      - name: Get the version and date on Ubuntu and macOS
        if: inputs.os != 'windows-latest'
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
            git_commit_hash="${{ github.event.pull_request.head.sha }}"
          else
            ver=V$ver_pure
            git_commit_hash=""
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
        shell: bash

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-latest'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
              $git_commit_hash = "${{ github.event.pull_request.head.sha }}"
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SoftFever_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
              $git_commit_hash = ""
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "git_commit_hash=$git_commit_hash" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

#   Mac
      - name: Install tools mac
        if: inputs.os == 'macos-14'
        run: |
          brew install libtool
          brew list
          mkdir -p ${{ github.workspace }}/deps/build

      - name: Free disk space
        if: inputs.os == 'macos-14'
        run: |
          df -hI /dev/disk3s1s1
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /dev/disk3s1s1

      - name: Build slicer mac
        if: inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        run: |
          ./build_release_macos.sh -s -n -x -a universal -t 10.15 -1

 # Thanks to RaySajuuk, it's working now
      - name: Sign app and notary
        if: github.repository == 'okets/OrcaMCP' && inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" $KEYCHAIN_PATH
          codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app
          # Sign OrcaSlicer_profile_validator.app if it exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app
          fi
          
          # Create main OrcaMCP DMG without the profile validator helper
          mkdir -p ${{ github.workspace }}/build/universal/OrcaMCP_dmg
          rm -rf ${{ github.workspace }}/build/universal/OrcaMCP_dmg/*
          cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app ${{ github.workspace }}/build/universal/OrcaMCP_dmg/OrcaMCP.app
          ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaMCP_dmg/Applications
          hdiutil create -volname "OrcaMCP" -srcfolder ${{ github.workspace }}/build/universal/OrcaMCP_dmg -ov -format UDZO OrcaMCP_Mac_universal_${{ env.ver }}.dmg
          codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" OrcaMCP_Mac_universal_${{ env.ver }}.dmg

          # Create separate OrcaMCP_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg/OrcaMCP_profile_validator.app
            ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg/Applications
            hdiutil create -volname "OrcaMCP Profile Validator" -srcfolder ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg -ov -format UDZO OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg
            codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg
          fi

          # Notarize main DMG
          # Install coreutils for gtimeout (macOS doesn't have timeout)
          brew install coreutils 2>/dev/null || true

          xcrun notarytool store-credentials "notarytool-profile" --apple-id "${{ secrets.APPLE_DEV_ACCOUNT }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_PWD }}"

          # Use gtimeout (30 min) to avoid infinite hangs
          if ! gtimeout 1800 xcrun notarytool submit "OrcaMCP_Mac_universal_${{ env.ver }}.dmg" --keychain-profile "notarytool-profile" --wait; then
            echo "::warning::Notarization failed or timed out! DMG is signed but NOT notarized. Users will see Gatekeeper warning."
          fi
          xcrun stapler staple OrcaMCP_Mac_universal_${{ env.ver }}.dmg || echo "::warning::Stapling failed - notarization may not have completed"

          # Notarize profile validator DMG if it exists
          if [ -f "OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg" ]; then
            if ! gtimeout 1800 xcrun notarytool submit "OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg" --keychain-profile "notarytool-profile" --wait; then
              echo "::warning::Profile validator notarization failed or timed out!"
            fi
            xcrun stapler staple OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg || true
          fi

      - name: Create DMG without notary
        if: github.repository != 'okets/OrcaMCP' && inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ${{ github.workspace }}/build/universal/OrcaMCP_dmg
          rm -rf ${{ github.workspace }}/build/universal/OrcaMCP_dmg/*
          cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app ${{ github.workspace }}/build/universal/OrcaMCP_dmg/OrcaMCP.app
          ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaMCP_dmg/Applications
          hdiutil create -volname "OrcaMCP" -srcfolder ${{ github.workspace }}/build/universal/OrcaMCP_dmg -ov -format UDZO OrcaMCP_Mac_universal_${{ env.ver }}.dmg

          # Create separate OrcaMCP_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg/OrcaMCP_profile_validator.app
            ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg/Applications
            hdiutil create -volname "OrcaMCP Profile Validator" -srcfolder ${{ github.workspace }}/build/universal/OrcaMCP_profile_validator_dmg -ov -format UDZO OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg
          fi

      - name: Upload artifacts mac
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_Mac_universal_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaMCP_Mac_universal_${{ env.ver }}.dmg

      - name: Upload OrcaMCP_profile_validator DMG mac
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_profile_validator_Mac_universal_DMG_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaMCP_profile_validator_Mac_universal_${{ env.ver }}.dmg
          if-no-files-found: ignore

# Windows
      - name: setup MSVC
        if: inputs.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Install nsis
        if: inputs.os == 'windows-latest'
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis

      - name: Build slicer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.26100.0\'
        run: .\build_release_vs.bat slicer

      - name: Create installer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}/build
        run: |
          cpack -G NSIS

      - name: Pack app
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}/build
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip OrcaMCP_Windows_${{ env.ver }}_portable.zip ${{ github.workspace }}/build/OrcaSlicer'

      - name: Pack PDB
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload artifacts Win zip
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_Windows_${{ env.ver }}_portable
          path: ${{ github.workspace }}/build/OrcaSlicer

      - name: Upload artifacts Win installer
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_Windows_${{ env.ver }}
          path: ${{ github.workspace }}/build/OrcaMCP*.exe

      - name: Upload artifacts Win PDB
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: PDB
          path: ${{ github.workspace }}/build/src/Release/Debug_PDB_${{ env.ver }}_for_developers_only.7z

      - name: Upload OrcaMCP_profile_validator Win
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_profile_validator_Windows_${{ env.ver }}
          path: ${{ github.workspace }}/build/src/Release/OrcaSlicer_profile_validator.exe

# Ubuntu
      - name: Apt-Install Dependencies
        if: inputs.os == 'ubuntu-24.04'
        uses: ./.github/actions/apt-install-deps

        # Tests must built at the same time as the slicer;
        # if you untangle them feel free to separate them here too
      - name: Build slicer and tests
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        shell: bash
        env:
          ubuntu-ver-str: ${{ (inputs.os == 'ubuntu-24.04' && '_ubuntu2404') || '' }}
        run: |
          ./build_linux.sh -istr
          mv -n ./build/OrcaMCP_Linux_V${{ env.ver_pure }}.AppImage ./build/OrcaMCP_Linux${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage
          chmod +x ./build/OrcaMCP_Linux${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage
          tar -cvpf build_tests.tar build/tests

        # Use tar because upload-artifacts won't always preserve directory structure
        # and doesn't preserve file permissions
      - name: Upload Test Artifact
        if: inputs.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.sha }}-tests
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Build orca_custom_preset_tests
        if: github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-24.04'
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: bash
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
          cd ${{ github.workspace }}/resources/profiles
          zip -r orca_custom_preset_tests.zip user/

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04' }}
        env:
          ubuntu-ver: ${{ (inputs.os == 'ubuntu-20.04' && '2004') || (inputs.os == 'ubuntu-24.04' && '2404') || '' }}
          ubuntu-ver-str: ${{ (inputs.os == 'ubuntu-24.04' && '_ubuntu2404') || '' }}
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_Linux_ubuntu_${{ env.ubuntu-ver }}_${{ env.ver }}
          path: './build/OrcaMCP_Linux${{ env.ubuntu-ver-str }}_${{ env.ver }}.AppImage'

      - name: Upload OrcaMCP_profile_validator Ubuntu
        if: ${{ ! env.ACT && inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04' }}
        env:
          ubuntu-ver: ${{ (inputs.os == 'ubuntu-20.04' && '2004') || (inputs.os == 'ubuntu-24.04' && '2404') || '' }}
        uses: actions/upload-artifact@v5
        with:
          name: OrcaMCP_profile_validator_Linux_ubuntu_${{ env.ubuntu-ver }}_${{ env.ver }}
          path: './build/src/Release/OrcaSlicer_profile_validator'

