# Fork-only. The same unittest command also runs in check_profiles.yml, but that workflow triggers
# only on pull requests into main and release/*, and this fork's work lands on mcp by push, so without
# this file no CI job ever ran the bridge's tests. It is cheap, and a change under scripts/ starts only
# this job -- except scripts/orcamcp_tools.json, which also starts Build all: only the C++ unit tests
# it runs can check the golden tool list against the registry.
name: Python tests

on:
  push:
    branches:
      - mcp
    paths:
      - 'scripts/**'
      - '.github/workflows/python_tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/python_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python_tests:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run the scripts' unit tests
        run: python3 -m unittest discover -s scripts/tests -t scripts
