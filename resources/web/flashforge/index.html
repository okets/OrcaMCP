/* ── Tokens ─────────────────────────────────────────────────────────────
   Dark is this design's home: an instrument panel in slate ink and brass.
   Light is a full, deliberate counterpart, not an inversion.            */
:root{
  --ground:#0B0E13; --ground-2:#0F141B; --panel:#141A22; --panel-2:#19212B;
  --edge:#263041; --edge-soft:#1D2531;
  --text:#E9EDF3; --text-2:#B4BECC; --muted:#7F8A9B;
  --brass:#D9A441; --brass-2:#F0C673; --brass-dim:#7A5C24;
  --good:#4FB286; --warn:#E0A458; --crit:#D9534F;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 32px -18px rgba(0,0,0,.9);
  --glass:rgba(233,237,243,.04);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E9ECF1; --ground-2:#F3F5F8; --panel:#FFFFFF; --panel-2:#F5F7FA;
    --edge:#CBD3DE; --edge-soft:#DFE5EC;
    --text:#101620; --text-2:#3B4756; --muted:#616E80;
    --brass:#8A6216; --brass-2:#A87A21; --brass-dim:#D9C79B;
    --good:#2E7D5B; --warn:#9A6516; --crit:#B03A36;
    --shadow:0 1px 0 rgba(255,255,255,.7), 0 12px 28px -20px rgba(16,22,32,.45);
    --glass:rgba(16,22,32,.035);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#E9ECF1; --ground-2:#F3F5F8; --panel:#FFFFFF; --panel-2:#F5F7FA;
  --edge:#CBD3DE; --edge-soft:#DFE5EC;
  --text:#101620; --text-2:#3B4756; --muted:#616E80;
  --brass:#8A6216; --brass-2:#A87A21; --brass-dim:#D9C79B;
  --good:#2E7D5B; --warn:#9A6516; --crit:#B03A36;
  --shadow:0 1px 0 rgba(255,255,255,.7), 0 12px 28px -20px rgba(16,22,32,.45);
  --glass:rgba(16,22,32,.035);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(1200px 620px at 78% -8%, rgba(217,164,65,.07), transparent 62%), var(--ground);
  color:var(--text);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.shell{max-width:1280px;margin:0 auto;padding:22px 22px 40px;display:flex;flex-direction:column;gap:16px}

/* ── Header ─────────────────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px;min-width:0}
.mark svg{flex:none}
.mark h1{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-optical-sizing:auto;
  font-weight:700;font-size:21px;letter-spacing:-.015em;margin:0;line-height:1.1;text-wrap:balance}
.mark .sub{color:var(--muted);font-size:12px;letter-spacing:.02em;margin-top:2px}
.spacer{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid var(--edge);
  border-radius:999px;background:var(--panel);font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.pill[data-state="printing"]{border-color:color-mix(in srgb,var(--brass) 55%,var(--edge));color:var(--brass-2)}
.pill[data-state="printing"] .dot{background:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent);animation:breathe 2.6s ease-in-out infinite}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;background:var(--glass);
  border:1px dashed var(--edge);color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.iconbtn{height:30px;width:30px;display:grid;place-items:center;border-radius:8px;cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);color:var(--text-2)}
.iconbtn:hover{border-color:var(--brass);color:var(--brass-2)}
.iconbtn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--edge-soft)}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow)}

/* ── Tool rail (the hero) ───────────────────────────────────────────── */
.toolrail{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tool{position:relative;overflow:hidden;padding:14px 14px 12px;border-radius:14px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--edge);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;transform:translateY(10px);opacity:0;
  animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
.tool:nth-child(1){animation-delay:.02s} .tool:nth-child(2){animation-delay:.09s}
.tool:nth-child(3){animation-delay:.16s} .tool:nth-child(4){animation-delay:.23s}
.tool .fiber{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fil,var(--edge))}
.tool[data-state="active"]{border-color:color-mix(in srgb,var(--fil) 45%,var(--edge))}
.tool[data-state="active"]::after{content:"";position:absolute;inset:-1px;border-radius:14px;pointer-events:none;
  background:radial-gradient(140px 60px at 12% 0%, color-mix(in srgb,var(--fil) 16%,transparent), transparent 70%)}
.tool[data-state="idle"]{opacity:.72}
.tool-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tool-id{display:flex;align-items:baseline;gap:7px}
.tool-id b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em}
.tool-id span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
  border:1px solid var(--edge);color:var(--muted);background:var(--glass);white-space:nowrap}
.badge[data-kind="active"]{border-color:color-mix(in srgb,var(--fil) 60%,transparent);color:var(--text);
  background:color-mix(in srgb,var(--fil) 16%,transparent)}
.badge[data-kind="standby"]{border-color:var(--brass-dim);color:var(--brass-2)}
.tool-body{display:flex;align-items:center;gap:12px}
.spool{flex:none}
.tool-fil{min-width:0;display:flex;flex-direction:column;gap:3px}
.tool-fil .name{font-weight:600;font-size:13px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-fil .meta{color:var(--muted);font-size:11px}
.tool-temp{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.tool-temp .now{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;letter-spacing:-.02em}
.tool-temp .tgt{color:var(--muted);font-size:12px}
.heat{height:4px;border-radius:3px;background:var(--edge-soft);overflow:hidden}
.heat i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--brass-dim),var(--brass));transition:width .8s ease}
.tool[data-state="idle"] .heat i{background:var(--edge)}

/* ── Instrument row ─────────────────────────────────────────────────── */
.instruments{display:grid;grid-template-columns:minmax(250px,1fr) minmax(340px,1.5fr) minmax(230px,.92fr);gap:16px;align-items:stretch}
.panelbody{padding:16px}
.machine{display:flex;flex-direction:column;gap:12px}
.machine .shot{
  position:relative;border-radius:11px;background:
    radial-gradient(80% 62% at 50% 96%, color-mix(in srgb,var(--brass) 12%,transparent), transparent 70%),
    var(--ground-2);
  border:1px solid var(--edge-soft);padding:10px 6px 6px;display:grid;place-items:center;
}
.machine .shot img{display:block;width:100%;max-width:230px;height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
:root[data-theme="light"] .machine .shot img{filter:drop-shadow(0 12px 16px rgba(16,22,32,.18))}
.machine .caps{display:flex;flex-wrap:wrap;gap:6px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;border-top:1px solid var(--edge-soft);padding-top:12px}
.spec{display:flex;flex-direction:column;gap:2px;min-width:0}
.spec dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:0;font-size:12.5px;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Camera */
.camera{display:flex;flex-direction:column;overflow:hidden}
.viewport{position:relative;aspect-ratio:16/10;background:linear-gradient(180deg,#0a0d12,#12171f);overflow:hidden;border-bottom:1px solid var(--edge)}
.viewport .scene{position:absolute;inset:0}
.viewport .vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.55));pointer-events:none}
.live{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;
  background:rgba(8,11,15,.62);backdrop-filter:blur(6px);border:1px solid rgba(233,237,243,.14);color:#E9EDF3;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.live .dot{width:6px;height:6px;border-radius:50%;background:#E5484D;animation:breathe 1.8s ease-in-out infinite}
.shotline{position:absolute;right:12px;top:12px;padding:5px 9px;border-radius:6px;background:rgba(8,11,15,.62);
  backdrop-filter:blur(6px);border:1px solid rgba(233,237,243,.14);color:#C8D0DC;font-size:11px;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.camfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.camfoot .file{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}

/* Environment */
.env{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--edge-soft)}
.row:last-child{border-bottom:0}
.row .k{display:flex;align-items:center;gap:9px;color:var(--text-2);font-size:12.5px;min-width:0}
.row .k svg{flex:none;color:var(--muted)}
.row .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.row .v small{color:var(--muted);font-size:11px}
.state-good{color:var(--good)} .state-warn{color:var(--warn)} .state-crit{color:var(--crit)}
.bar{height:4px;width:60px;border-radius:3px;background:var(--edge-soft);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .8s ease}

/* ── Job ────────────────────────────────────────────────────────────── */
.job{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.job-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.job-title{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.job-title .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:17px;letter-spacing:-.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-title .s{color:var(--muted);font-size:12px}
.job-pct{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;
  letter-spacing:-.03em;line-height:1;color:var(--brass-2)}
.job-pct sub{font-size:14px;color:var(--muted);vertical-align:baseline;margin-left:2px}
.ribbon{display:flex;gap:2px;align-items:flex-end;height:44px}
.ribbon i{flex:1;border-radius:1.5px;background:var(--edge-soft);transition:background .4s ease}
.ribbon i[data-done="1"]{background:var(--c)}
.job-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px 18px;border-top:1px solid var(--edge-soft);padding-top:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px}

/* ── Controls + files ───────────────────────────────────────────────── */
.files ul{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
.files li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--edge-soft)}
.files li:last-child{border-bottom:0}
.mini{height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--edge);background:var(--panel-2);color:var(--text-2);font:inherit;font-size:12px;cursor:pointer}
.mini:hover{border-color:var(--brass);color:var(--brass-2)}
.mini:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

footer.foot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:11.5px;padding-top:2px}
footer.foot .sep{width:1px;height:12px;background:var(--edge)}

/* ── Editable temperature target ────────────────────────────────────
   temperatureCtl_cmd takes a 4-slot nozzle array plus bed and chamber,
   with -200 meaning "leave this one alone" — so any target here can be
   set on its own.                                                     */
.tset{display:inline-flex;align-items:center;gap:4px;font:inherit;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-2);background:var(--glass);
  border:1px solid var(--edge);padding:1px 5px 1px 6px;cursor:text;border-radius:6px;vertical-align:baseline}
.tset .pencil{flex:none;opacity:.75;color:var(--muted)}
.tset:hover{color:var(--brass-2);border-color:var(--brass);background:color-mix(in srgb,var(--brass) 10%,transparent)}
.tset:hover .pencil{opacity:1;color:var(--brass-2)}
.tset:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── Control bar (lives under the camera, so it needs no scrolling) ── */
.controlbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--edge-soft)}
.cb-group{display:flex;align-items:center;gap:6px}
.cb-div{width:1px;height:22px;background:var(--edge-soft)}
.cb-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;cursor:pointer;
  background:var(--ground-2);border:1px solid var(--edge);color:var(--muted);font:inherit;font-size:12px}
.toggle svg{flex:none}
.toggle[aria-pressed="true"]{border-color:color-mix(in srgb,var(--brass) 60%,var(--edge));color:var(--brass-2);
  background:color-mix(in srgb,var(--brass) 12%,transparent)}
.toggle:hover{color:var(--text)}
.toggle:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--edge);color:var(--text);font:inherit;font-size:12.5px;font-weight:500}
.tbtn:hover{border-color:var(--brass);color:var(--brass-2)}
.tbtn[data-tone="stop"]:hover{border-color:var(--crit);color:var(--crit)}
.tbtn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.seg{display:inline-flex;background:var(--ground-2);border:1px solid var(--edge);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;padding:4px 9px;border-radius:6px;
  cursor:pointer;font-family:"IBM Plex Mono",monospace}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--brass-2)}
.stepper{display:inline-flex;align-items:center;gap:8px;background:var(--ground-2);border:1px solid var(--edge);border-radius:8px;padding:3px 4px}
.stepper button{width:24px;height:22px;border:0;border-radius:5px;background:transparent;color:var(--text-2);cursor:pointer;font-size:15px;line-height:1}
.stepper .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;min-width:56px;text-align:center}

/* ── Slot actions on each tool card ─────────────────────────────────── */
.slotact{display:flex;align-items:center;gap:6px;margin-top:2px}
.slotbtn{flex:1;height:26px;border-radius:7px;border:1px solid var(--edge);background:var(--ground-2);color:var(--muted);
  font:inherit;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.slotbtn:hover{border-color:color-mix(in srgb,var(--fil) 55%,var(--edge));color:var(--text)}
.slotbtn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.loadprog{display:flex;flex-direction:column;gap:5px;padding:7px 8px;border-radius:8px;
  background:color-mix(in srgb,var(--brass) 9%,transparent);border:1px solid var(--brass-dim)}
.loadprog .lp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--brass-2)}
.lp-steps{display:flex;gap:3px}
.lp-steps i{flex:1;height:3px;border-radius:2px;background:var(--edge-soft)}
.lp-steps i[data-on="1"]{background:var(--brass)}

/* ── Live-data states the sample never had to show ───────────────────
   A real machine is idle far more often than it prints, and a material
   station is usually part empty. Those states get the same care as the
   busy ones: nothing here is a placeholder for missing design.       */
.tool[data-state="empty"]{opacity:.66;border-style:dashed}
.tool[data-state="empty"] .fiber{background:var(--edge)}
.tool[data-state="empty"] .heat i{background:var(--edge)}
.tool[data-state="loading"]{border-color:var(--brass-dim)}
.pill[data-state="paused"]{border-color:color-mix(in srgb,var(--warn) 55%,var(--edge));color:var(--warn)}
.pill[data-state="paused"] .dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.pill[data-state="offline"]{border-color:color-mix(in srgb,var(--crit) 55%,var(--edge));color:var(--crit)}
.pill[data-state="offline"] .dot{background:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 22%,transparent)}
.pill[data-state="idle"] .dot{background:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 22%,transparent)}
.stationstrip{margin:0 0 12px}
.idle-big{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:19px;
  letter-spacing:-.012em;line-height:1.2}
.nodata{padding:14px;color:var(--muted);font-size:12.5px}
.banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:11px;
  border:1px solid color-mix(in srgb,var(--crit) 45%,var(--edge));background:color-mix(in srgb,var(--crit) 8%,transparent);
  color:var(--text-2);font-size:12.5px}
.banner b{color:var(--crit);font-weight:600}
/* ── The project disagreeing with the machine ────────────────────────
   Not an error and never a modal: one line saying what differs, a button
   that fixes it, and an x meaning "I know". Brass, not crimson - the
   printer is fine, the project is merely out of date.                 */
.suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;
  border-radius:11px;border:1px solid color-mix(in srgb,var(--brass) 45%,var(--edge));
  background:color-mix(in srgb,var(--brass) 8%,transparent);color:var(--text-2);font-size:12.5px}
.suggest .s-dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none}
.suggest .s-text{flex:1 1 18em;min-width:0}
.suggest .s-go,.suggest .s-x{flex:none}
.suggest .s-x{width:26px;height:26px;font-size:16px;line-height:1}
.matchmsg{display:block;margin:-4px 0 12px;font-size:11.5px;line-height:1.45;color:var(--muted)}
.matchmsg[data-kind="warn"]{color:var(--warn)}
.matchmsg:empty{display:none}
.viewport img.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#0a0d12}
.camoff{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;
  color:#8A94A4;font-size:12px;line-height:1.6}
/* A control the machine cannot act on right now keeps its place and says why on hover. */
button:disabled,.tset:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover,.tset:disabled:hover{border-color:var(--edge);color:inherit;background:var(--ground-2)}
.tset:disabled:hover{background:var(--glass)}
.slotbtn:disabled:hover{border-color:var(--edge);color:var(--muted)}

/* ── Pending, and what went wrong ────────────────────────────────────
   A control never shows a state the printer has not confirmed. Pressing
   one dims it and lets it breathe until the next status either agrees or
   the printer explains itself - inline, next to the control, never in a
   dialog. Opacity and border only, so nothing moves as it settles.   */
[data-pending="1"],button[data-pending="1"]{opacity:.62;cursor:progress;border-color:var(--brass);
  animation:pulse 1.15s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.92}}
.ctlmsg{display:block;margin-top:5px;font-size:11px;line-height:1.4;color:var(--warn);
  white-space:normal;max-width:26em;font-weight:400}
.ctlmsg:empty{display:none}
.controlbar .ctlmsg{flex-basis:100%;margin:0}
.tset-edit{width:62px;font:inherit;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--brass);border-radius:6px;
  padding:1px 5px;outline:none;vertical-align:baseline;-webkit-appearance:none}
/* Stopping a print is destructive, so it takes a second, deliberate click. */
.confirm{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--crit)}
/* The entry animation belongs to the first paint, not to every poll. */
body[data-ready="1"] .tool{animation:none;opacity:1;transform:none}
body[data-ready="1"] .tool[data-state="idle"]{opacity:.72}
body[data-ready="1"] .tool[data-state="empty"]{opacity:.66}

@keyframes rise{to{transform:translateY(0);opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .tool{opacity:1;transform:none}
}
@media (max-width:1080px){
  .instruments{grid-template-columns:1fr 1fr}
  .instruments .camera{grid-column:1/-1;order:-1}
}
@media (max-width:720px){
  .toolrail{grid-template-columns:1fr 1fr}
  .instruments{grid-template-columns:1fr}
  .shell{padding:16px 14px 32px}
}

<script>
(function(){
  "use strict";

  /* ══ Bridge ═══════════════════════════════════════════════════════════
     This page and OrcaSlicer talk over the wxWebView script-message
     channel, not HTTP: the page posts {id, method, params} through
     window.wx.postMessage, and C++ answers by evaluating
       window.orcaFlashforge.receive({id, method, ok, result})
     back into this document. id 0 marks an unsolicited push, so the
     poller and a direct answer arrive through the same door.

     With no bridge — this file opened in a browser for design work —
     SAMPLE below stands in and the "Sample data" chip appears.        */

  var pending = {}, seq = 0;

  function makeBridge(){
    window.orcaFlashforge = { receive: receive };
    return { call: function(method, params){
      var id = ++seq;
      return new Promise(function(resolve, reject){
        pending[id] = { resolve: resolve, reject: reject };
        window.wx.postMessage(JSON.stringify({ id: id, method: method, params: params || {} }));
      });
    }};
  }

  function receive(msg){
    if (!msg || typeof msg !== "object") return;

    /* The host parks this page when its printer stops being the selected one.
       Asking again would restart exactly the polling it just stopped, so the
       page goes quiet until it is told otherwise. */
    if (msg.method === "suspended"){
      /* Parked: no poll is coming, so nothing would ever confirm a pending control - and a reply
         still in flight must not settle one either, on a page that has stopped showing this
         printer. Both sides of the conversation are dropped. */
      suspended = true;
      waiting   = {};
      for (var id in pending)
        if (pending.hasOwnProperty(id)) pending[id].reject(new Error("The console was parked."));
      pending = {};
      disarmStop();
      repaint();
      return;
    }
    if (msg.method === "resumed"){
      suspended    = false;
      lastStatusAt = Date.now();
      askNow();
      return;
    }

    var p = pending[msg.id];
    if (p){
      delete pending[msg.id];
      if (msg.ok) p.resolve(msg.result); else p.reject(new Error(msg.error || "failed"));
    }
    if (msg.method === "status")
      onStatus(msg.ok ? msg.result : { connected:false, error: msg.error || "No answer from OrcaSlicer" });
  }

  var bridge = (window.wx && typeof window.wx.postMessage === "function") ? makeBridge() : null;

  /* ══ Sample state ═════════════════════════════════════════════════════
     The exact shape the bridge delivers, so there is one render path.
     `raw` mirrors the printer's own /detail object field for field.   */
  var SAMPLE = {
    connected:true, sample:true, preset:"C5P", host:"10.0.0.10", poll_ms:2000,
    printer:{
      state:"printing", print_file:"lattice-planter-4c.gcode.3mf",
      progress:0.349, duration_s:8324, remaining_s:14520,
      light_on:true, door:"close", error_code:"",
      name:"Creator 5 Pro", model:"Creator 5 Pro", firmware:"1.9.9", ip:"10.0.0.10", pid:41,
      camera_stream_url:"",
      temperatures:{
        bed:{current:60.2,target:60}, chamber:{current:41.0,target:45},
        nozzles:[{tool:0,current:245,target:245},{tool:1,current:240,target:240},
                 {tool:2,current:240,target:240},{tool:3,current:34,target:0}]
      },
      material_station:{present:true, slots:[
        {slot_id:1,has_filament:true,material:"PLA Silk",color:"#F435F6"},
        {slot_id:2,has_filament:true,material:"PLA Basic",color:"#4CAAF8"},
        {slot_id:3,has_filament:true,material:"PLA Basic",color:"#FFF245"},
        {slot_id:4,has_filament:true,material:"PLA Matte",color:"#BEBEBE"}]},
      raw:{
        nozzleCnt:4, nozzleModel:"0.4mm;0.4mm;0.4mm;0.4mm", measure:"256X256X256",
        location:"Studio", camera:1, coolingFanSpeed:78, chamberFanSpeed:40,
        internalFanStatus:"open", externalFanStatus:"close",
        remainingDiskSpace:4.96, tvoc:0.12,
        cumulativePrintTime:19122, cumulativeFilament:4820.5,
        printLayer:412, targetPrintLayer:1180, printSpeedAdjust:100, zAxisCompensation:0.02,
        matlStationInfo:{ slotCnt:4, currentSlot:1, currentLoadSlot:4, stateAction:1, stateStep:3,
          slotInfos:[{slotId:1,hasFilament:true,materialName:"PLA Silk",materialColor:"#F435F6"},
                     {slotId:2,hasFilament:true,materialName:"PLA Basic",materialColor:"#4CAAF8"},
                     {slotId:3,hasFilament:true,materialName:"PLA Basic",materialColor:"#FFF245"},
                     {slotId:4,hasFilament:true,materialName:"PLA Matte",materialColor:"#BEBEBE"}] }
      }
    }
  };

  /* ══ Small helpers ════════════════════════════════════════════════════ */
  function el(id){ return document.getElementById(id); }
  function setHTML(node, html){ if (node && node.__h !== html){ node.__h = html; node.innerHTML = html; } }
  /* Markup that contains a temperature chip. Rebuilding it while one of those chips is an open
     editor would strand what the user is typing, so the rebuild waits for the next poll - by
     which time the editor has almost certainly closed. */
  function setStructure(node, html){
    if (node && node.__h !== html && !document.querySelector(".tset-edit")) setHTML(node, html);
  }
  function setText(node, text){ if (node && node.textContent !== text) node.textContent = text; }
  function show(node, on){ if (node) node.hidden = !on; }
  /* Anything that changes every poll is a [data-live] hole in otherwise static
     markup, filled by applyLive(). Rebuilding the rail once a second instead
     would snap every CSS transition and tear the element out from under a
     hovering pointer - which is how the disabled controls explain themselves. */
  function live(key){ return document.querySelector('[data-live="' + key + '"]'); }
  function setLive(key, text){ setText(live(key), text); }
  function setLiveWidth(key, fraction){
    var n = live(key);
    if (!n) return;
    var w = Math.round(Math.max(0, Math.min(1, fraction)) * 100) + "%";
    if (n.style.width !== w) n.style.width = w;
  }
  function setLiveTarget(key, value){
    var n = live(key);
    if (!n) return;
    var v = Math.round(num(value));
    setText(n, String(v));
    var btn = n.parentNode;
    if (btn && btn.getAttribute("data-live-label"))
      btn.setAttribute("aria-label", btn.getAttribute("data-live-label") + ", currently " +
                       (v ? v + " degrees" : "off"));
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  /* The printer is loose about types - an int here, a numeric string there - so
     this accepts what the C++ side accepts rather than silently reading 0. */
  function num(v, d){
    if (typeof v === "number" && isFinite(v)) return v;
    if (typeof v === "boolean") return v ? 1 : 0;
    if (typeof v === "string" && v !== ""){
      var n = Number(v);
      if (isFinite(n)) return n;
    }
    return d === undefined ? 0 : d;
  }
  function t1(v){ return num(v).toFixed(1); }
  function pick(o, k, d){ return (o && o[k] !== undefined && o[k] !== null) ? o[k] : d; }
  function isHex(c){ return typeof c === "string" && /^#?[0-9A-Fa-f]{6}$/.test(c); }
  function hex(c){ return isHex(c) ? (c.charAt(0) === "#" ? c : "#" + c) : ""; }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function clock(sec){
    sec = Math.max(0, Math.round(num(sec)));
    return pad2(Math.floor(sec/3600)) + ":" + pad2(Math.floor(sec%3600/60)) + ":" + pad2(sec%60);
  }
  function dur(sec){
    sec = Math.max(0, Math.round(num(sec)));
    var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
    return h ? (h + " h " + pad2(m) + " m") : (m + " m");
  }
  function durMinutes(min){
    min = Math.max(0, Math.round(num(min)));
    var h = Math.floor(min/60);
    return h ? (h.toLocaleString() + " h " + pad2(min%60) + " m") : (min + " m");
  }
  function eta(remaining){
    if (!(num(remaining) > 0)) return "—";
    var d = new Date(Date.now() + num(remaining)*1000);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function ratio(now, target){ return num(target) > 0 ? Math.max(0, Math.min(1, num(now)/num(target))) : 0; }
  function round3(v){ return Math.round(num(v) * 1000) / 1000; }
  function zText(v){ return (num(v) >= 0 ? "+" : "−") + Math.abs(num(v)).toFixed(3) + " mm"; }
  function assign(target, extra){
    for (var k in extra) if (extra.hasOwnProperty(k)) target[k] = extra[k];
    return target;
  }
  function setLiveHTML(key, html){ setHTML(live(key), html); }
  function setAttr(node, name, value){
    if (node && node.getAttribute(name) !== value) node.setAttribute(name, value);
  }
  function setFlag(node, name, on){
    if (!node) return;
    if (on) setAttr(node, name, "1");
    else if (node.hasAttribute(name)) node.removeAttribute(name);
  }

  /* ══ Vocabulary the printer speaks ═══════════════════════════════════
     stateStep / stateAction come straight from matlStationInfo; the
     step names are the vendor's own (heating, push, purge, cut, retract,
     complete) and stateAction 1/2 are the only two that mean filament is
     actually moving.                                                    */
  var STEPS   = ["Heating","Pushing filament","Purging old filament","Cutting filament","Retracting filament","Complete"];
  var ACTIONS = { 1:"Loading", 2:"Unloading" };
  var STATES  = {
    printing:["printing","Printing"], heating:["printing","Heating"], busy:["printing","Busy"],
    paused:["paused","Paused"], ready:["idle","Ready"], completed:["idle","Completed"],
    cancelled:["idle","Cancelled"], error:["offline","Error"], unknown:["idle","Unknown"]
  };

  /* ══ Fragments ════════════════════════════════════════════════════════ */
  var PENCIL = '<svg class="pencil" width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true">'+
    '<path d="M10.8 2.7 13.3 5.2 5.7 12.8 2.7 13.3 3.2 10.3 10.8 2.7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>'+
    '<path d="M9.5 4 12 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  /* Two things the printer's local API has no command for. They keep their place in the
     design - the machine can do both, just not from here - and say so on hover. */
  var NO_SLOT_CMD = "Material slots are named and coloured at the printer; its local API has no command for it.";
  var NO_TIMELAPSE = "Time-lapse is chosen when a job is sent to the printer, not from here.";

  /* A target you can type into. The value is a live hole so a drifting target never
     rebuilds the button under the cursor, and data-ctl is what makes it clickable. */
  function tset(label, key, ctl){
    return '<button class="tset" type="button" data-ctl="'+esc(ctl)+'" data-live-label="'+esc(label)+'">'+
      '<span class="tval" data-live="'+key+'"></span>'+PENCIL+'</button>';
  }
  /* Where a refusal about that chip appears: its own line, directly under the control. */
  function tmsg(ctl){ return '<span class="ctlmsg" data-msg="'+esc(ctl)+'"></span>'; }

  function slotActions(){
    return '<div class="slotact">'+
      '<button class="slotbtn" type="button" disabled title="'+esc(NO_SLOT_CMD)+'">'+PENCIL+'Edit slot</button>'+
      '<button class="slotbtn" type="button" disabled title="'+esc(NO_SLOT_CMD)+'">'+
        '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" aria-hidden="true">'+
        '<circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.3"/>'+
        '<path d="M8 7.2v3.4M8 5.2v.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'+
        'Details</button></div>';
  }

  /* The strip only exists while filament is genuinely moving; it is built
     from stateAction/stateStep, never from a constant. */
  function loadStrip(action, step, where){
    var label = ACTIONS[action] || "Filament move";
    var s     = Math.max(0, Math.min(STEPS.length, Math.round(num(step))));
    var name  = s > 0 ? STEPS[s-1] : "Starting";
    var ticks = STEPS.map(function(_, i){ return '<i data-on="'+(i < s ? 1 : 0)+'"></i>'; }).join("");
    return '<div class="loadprog"><div class="lp-head"><span>'+esc(label)+(where ? " · " + esc(where) : "")+
      ' · '+esc(name)+'</span><span class="mono">'+s+'/'+STEPS.length+'</span></div>'+
      '<div class="lp-steps">'+ticks+'</div></div>';
  }

  function spoolSVG(n, color, loaded){
    var r = 15.5, ring;
    if (loaded && color)
      ring = '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" opacity=".92"/>';
    else if (loaded)
      /* Loaded, but the printer has no colour for this slot yet: hatched,
         never a made-up colour. */
      ring = '<defs><pattern id="hatch'+n+'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
             '<rect width="6" height="6" fill="var(--edge-soft)"/><rect width="3" height="6" fill="var(--muted)" opacity=".6"/></pattern></defs>'+

  function renderMachine(p, raw, pro){
    var shot = el("machineShot");
    var src  = num(p.pid) === 40 ? "printer-c5.png" : (num(p.pid) === 41 ? "printer-c5pro.png" : "");
    if (src && shot.getAttribute("src") !== src){
      shot.setAttribute("src", src);
      shot.alt = (p.name || "Flashforge printer") + ", four-toolhead 3D printer";
    }
    shot.style.display = src ? "" : "none";

    var nozzles = num(raw.nozzleCnt, (p.temperatures && p.temperatures.nozzles || []).length);
    var caps = [];
    if (nozzles) caps.push('<span class="badge">'+nozzles+' toolheads</span>');
    if (pick(p, "material_station", {}).present) caps.push('<span class="badge">Material station</span>');
    caps.push(pro ? '<span class="badge" data-kind="standby">Heated chamber</span>'
                  : '<span class="badge">Open frame</span>');
    if (pro) caps.push('<span class="badge" data-kind="standby">Air filtration</span>');
    if (num(raw.camera)) caps.push('<span class="badge">Camera</span>');
    setHTML(el("machineCaps"), caps.join(""));

    var specs = [];
    if (raw.measure) specs.push(["Build volume", String(raw.measure).replace(/[xX]/g, " × ") + " mm"]);
    if (nozzles && raw.nozzleModel){
      var kinds = String(raw.nozzleModel).split(";").filter(Boolean)
                    .map(function(k){ return k.replace(/([0-9.])(mm)$/i, "$1 mm"); });
      var same  = kinds.length && kinds.every(function(k){ return k === kinds[0]; });
      specs.push(["Nozzles", same ? (nozzles + " × " + kinds[0]) : kinds.join(", ")]);
    }
    specs.push([pro ? "Chamber" : "Enclosure", pro ? "Heated" : "None"]);
    if (raw.location) specs.push(["Location", String(raw.location)]);
    // The firmware documents no units for these two. Minutes and metres are the
    // only self-consistent reading of what a real machine reports (1270 and 45.3
    // on a printer with ~21 h on it); hours would put 45 m of filament across 53
    // days of printing, and seconds would put it across 21 minutes.
    if (raw.cumulativePrintTime !== undefined) specs.push(["Lifetime", durMinutes(raw.cumulativePrintTime)]);
    if (raw.cumulativeFilament !== undefined) specs.push(["Filament used", num(raw.cumulativeFilament).toFixed(1) + " m"]);
    setHTML(el("machineSpecs"), specs.map(function(r){
      return '<div class="spec"><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>';
    }).join(""));
  }

  /* On a toolchanger, material slot N is toolhead N — so the spool and the
     nozzle belong on one card, not in two separate panels. */
  function slotsById(p){
    var byId = {};
    ((pick(p, "material_station", {}).slots) || []).forEach(function(s){ byId[num(s.slot_id)] = s; });
    return byId;
  }

  function renderTools(p, raw, ms){
    var slots   = (pick(p, "material_station", {}).slots) || [];
    var byId    = slotsById(p);
    var nozzles = (p.temperatures && p.temperatures.nozzles) || [];
    var count   = Math.max(num(raw.nozzleCnt), num(ms.slotCnt), slots.length, nozzles.length);
    if (!count){
      /* Nothing reported yet - but a connection blip must not throw away the cards it already
         drew, so this only fires before the first snapshot arrives. */
      if (!document.querySelector("[data-tool]")){
        setHTML(el("stationStrip"), "");
        setStructure(el("toolrail"), '<div class="card nodata">Waiting for the printer to report its toolheads…</div>');
      }
      return;
    }

    var html = "";
    for (var i = 0; i < count; i++){
      var n    = i + 1;
      var slot = byId[n] || { slot_id:n, has_filament:false, material:"", color:"" };
      var col  = hex(slot.color);
      var on   = !!slot.has_filament;

      var name = on ? (slot.material || "Filament loaded") : "Empty";
      var meta = on ? (col ? col.toUpperCase() : "Colour not set") : "No spool in this slot";
      var tip  = (on && !col)
        ? "The printer has not reported a material or colour for this slot yet. Edit slot will set it."
        : "";

      /* Structure only: what changes from poll to poll - the card's state, its badge and the
         load strip - is written in place by applyToolCards(), so a card is rebuilt only when the
         spool in it genuinely changes. A rail rebuilt every second would strand an open
         temperature editor and tear a card out from under the pointer about to click it. */
      html += '<article class="tool" data-tool="'+n+'" data-state="idle" style="--fil:'+(col || "var(--muted)")+'">'+
        '<span class="fiber"></span>'+
        '<div class="tool-head"><span class="tool-id"><b>Tool '+n+'</b><span>slot '+n+'</span></span>'+
          '<span class="badge" data-live-badge="'+n+'"></span></div>'+
        '<div class="tool-body">'+spoolSVG(n, col, on)+
          '<span class="tool-fil"><span class="name">'+esc(name)+'</span>'+
          '<span class="meta mono"'+(tip ? ' title="'+esc(tip)+'"' : '')+'>'+esc(meta)+'</span></span></div>'+
        '<div class="tool-temp"><span class="now" data-live="nozzle-now-'+n+'"></span>'+
          '<span class="tgt mono">°C / </span>'+tset("Tool "+n+" target", "nozzle-target-"+n, "temp-nozzle-"+n)+
          '<span class="tgt mono">°C</span></div>'+
        tmsg("temp-nozzle-"+n)+
        '<span class="heat"><i data-live="nozzle-heat-'+n+'"></i></span>'+
        '<span data-grp="slotact-'+n+'">'+slotActions()+'</span>'+
        '<span data-live-load="'+n+'"></span>'+
        '</article>';
    }
    setStructure(el("toolrail"), html);
  }

  /* The volatile half of every card, written in place after each poll. */
  function applyToolCards(p, raw, ms, printing){
    /* No snapshot: the cards keep the state they were last told about rather than every slot
       claiming to be empty. The em-dashed readings and the banner already say it is stale. */
    if (!p) return;
    var byId    = slotsById(p);
    var nozzles = (p.temperatures || {}).nozzles || [];
    var action  = num(ms.stateAction);
    var moving  = action === 1 || action === 2;
    var step    = num(ms.stateStep);
    var moveOn  = num(ms.currentLoadSlot) || num(ms.currentSlot) || 0;
    var feeding = num(ms.currentLoadSlot);
    var current = num(ms.currentSlot);

    /* A move with no slot named still has to be visible somewhere. */
    setHTML(el("stationStrip"),
      (moving && !moveOn) ? '<div class="stationstrip">'+loadStrip(action, step, "material station")+'</div>' : "");

    var cards = document.querySelectorAll("[data-tool]");
    for (var i = 0; i < cards.length; i++){
      var card = cards[i];
      var n    = num(card.getAttribute("data-tool"));
      var slot = byId[n] || { has_filament:false };
      var nz   = nozzles[n - 1] || { target:0 };
      var on   = !!slot.has_filament;
      var busy = moving && moveOn === n;

      var state, badge, kind;
      if (busy)                          { state = "loading"; badge = ACTIONS[action]; kind = "standby"; }
      else if (printing && current === n){ state = "active";  badge = "Printing";      kind = "active";  }
      else if (feeding === n)            { state = "active";  badge = "Feeding";       kind = "standby"; }
      else if (num(nz.target) > 0)       { state = "idle";    badge = "Standby";       kind = "standby"; }
      else if (!on)                      { state = "empty";   badge = "Empty";         kind = "idle";    }
      else                               { state = "idle";    badge = "Idle";          kind = "idle";    }

      setAttr(card, "data-state", state);
      var pip = card.querySelector("[data-live-badge]");
      setAttr(pip, "data-kind", kind);
      setText(pip, badge);
      show(card.querySelector('[data-grp="slotact-'+n+'"]'), !busy);
      setHTML(card.querySelector("[data-live-load]"), busy ? loadStrip(action, step) : "");
    }
  }

  /* Chamber, filtration and air quality only exist on the Pro (pid 41). Light, door and
     filtration are live holes rather than markup: the light is a control now, and rebuilding
     this panel every time it changed would tear the bed and chamber chips out from under the

      row("door","Door", '<span data-live="door"></span>') +

      row("disk","Storage", '<span data-live="disk"></span> <small>GB free</small>');
    setStructure(el("envRows"), html);

  /* The MJPEG stream is an ordinary <img>; it is created once and only its
     src is touched, so a re-render never restarts the stream. */
  var camSrc = null;
  function renderCamera(s, p, raw, pro, printing){
    var url   = s.connected ? (p.camera_stream_url || "") : "";
    var scene = el("camScene");
    if (url !== camSrc){
      camSrc = url;
      if (url){
        scene.innerHTML = '<img class="cam" alt="Live camera view of the build plate">';
        var img = scene.firstChild;
        show(el("camLive"), true);
        img.onerror = function(){
          show(el("camLive"), false);
          scene.innerHTML = '<div class="camoff">Camera stream unavailable.<br>' +
            'The printer serves it at ' + esc(url) + '.</div>';
        };
        img.src = url;
      } else {
        show(el("camLive"), false);
        scene.innerHTML = '<div class="camoff">' +
          (s.connected ? "This printer reports no camera stream." : "Waiting for the printer…") + '</div>';
      }
    }

    setText(el("camFile"), printing ? (p.print_file || "Printing") : (p.name || ""));
    var badge = el("camBadge");
    show(badge, pro && s.connected);
    if (pro && s.connected) setText(badge, "Chamber " + t1((((p.temperatures)||{}).chamber||{}).current) + " °C");
    show(el("camClock"), printing);
    if (printing) setText(el("camClock"), clock(p.duration_s));
  }

  var SPEEDS  = [50, 100, 125, 166];

  /* Structure only, and it depends on nothing but the machine kind: every value, pressed state,

  /* No printer in this snapshot - a blip, or the first moments. The panels keep their shape and
     say they have nothing rather than showing the last reading as though it were current. */
  function blankLive(){
    var holes = document.querySelectorAll("[data-live]");
    for (var i = 0; i < holes.length; i++){
      var key = holes[i].getAttribute("data-live");
      if (/-bar$|-heat-/.test(key)){ holes[i].style.width = "0%"; continue; }
      if (key === "z-value") continue;          // applyControls owns this one
      setHTML(holes[i], "—");
    }
  }

  /* Runs after every poll, whether or not anything structural changed. */
  function applyLive(p, raw){
    if (!p){ blankLive(); return; }
    var t   = p.temperatures || {};
    var bed = t.bed || {}, ch = t.chamber || {};
    var nozzles = t.nozzles || [];

    for (var i = 0; i < nozzles.length; i++){
      var nz = nozzles[i] || {};
      setLive("nozzle-now-" + (i + 1), t1(nz.current));
      setLiveTarget("nozzle-target-" + (i + 1), nz.target);
      setLiveWidth("nozzle-heat-" + (i + 1), ratio(nz.current, nz.target));
    }

    setLive("bed-now", t1(bed.current));
    setLiveTarget("bed-target", bed.target);
    setLiveWidth("bed-bar", ratio(bed.current, bed.target));
    setLive("chamber-now", t1(ch.current));
    setLiveTarget("chamber-target", ch.target);
    setLiveWidth("chamber-bar", ratio(ch.current, ch.target));

    setLive("fan",  String(Math.round(num(raw.coolingFanSpeed))));
    setLive("tvoc", num(raw.tvoc).toFixed(2));
    setLive("disk", num(raw.remainingDiskSpace).toFixed(2));

    var fans = [];
    if (String(raw.internalFanStatus) === "open") fans.push("Internal");
    if (String(raw.externalFanStatus) === "open") fans.push("External");
    setLiveHTML("filtration", fans.length ? '<span class="state-good">'+esc(fans.join(" + "))+'</span>' : "Off");
    setLiveHTML("light", p.light_on ? '<span class="state-good">On</span>' : "Off");
    var door = String(p.door || "").toLowerCase();
    setLiveHTML("door", door === "open" ? '<span class="state-warn">Open</span>'
                      : door ? '<span class="state-good">Closed</span>' : "—");
    setLive("z-value", zText(num(raw.zAxisCompensation)));
  }

  /* ══ Controls ═════════════════════════════════════════════════════════
     Optimistic, but never dishonest. A click sends one command and marks the
     control pending; the pending state clears only when the printer's own
     next status reports the value that was asked for, when the printer
     refuses (its words appear beside the control), or when the wait runs
     out - and then the control settles on whatever the printer says, not on
     what the click hoped for. Nothing here ever opens a dialog.        */

  /* Long enough for the immediate poll the command triggers plus two more at
     the idle cadence, short enough that a control does not sit spinning. */
  var WAIT_MS = 14000, MSG_MS = 8000, STOP_ARM_MS = 6000, STOP_SAFE_MS = 400;
  var waiting = {}, msgTimers = {}, lastState = null;

  function ctlNode(key){ return document.querySelector('[data-ctl="' + key + '"]'); }
  function grpNode(name){ return document.querySelector('[data-grp="' + name + '"]'); }
  /* Everything on the control bar shares one message line; a temperature chip
     gets its own, because its bar is somewhere else on the page entirely. */
  function msgSlot(key){ return key.indexOf("temp-") === 0 ? key : "bar"; }

  function showMsg(slot, text){
    var node = document.querySelector('[data-msg="' + slot + '"]');
    if (!node) return;
    setText(node, text || "");
    if (msgTimers[slot]) clearTimeout(msgTimers[slot]);
    if (text) msgTimers[slot] = setTimeout(function(){ setText(node, ""); }, MSG_MS);
  }

  /* The value a control should be showing right now: what the last press asked
     for while that press is still unconfirmed, and the printer's own otherwise. */
  function expected(key, reported){
    var w = waiting[key];
    return (w && w.show !== undefined) ? w.show : reported;
  }

  function beginWait(key, expect, show, label){
    waiting[key] = { expect: expect, show: show, until: Date.now() + WAIT_MS, label: label };
    showMsg(msgSlot(key), "");
    repaint();
  }

  /* Run against every incoming status: agree, or eventually own up. */
  function settleWaits(s){
    var now = Date.now();
    for (var key in waiting){
      if (!waiting.hasOwnProperty(key)) continue;
      var w = waiting[key], done = false;
      try { done = !!w.expect(s); } catch (e) { done = false; }
      if (done){ delete waiting[key]; continue; }
      if (now > w.until){
        delete waiting[key];
        showMsg(msgSlot(key), w.label + " did not change: the printer still reports its previous value.");
      }
    }
  }

  function command(key, name, params, expect, show, label){
    if (!bridge || suspended){
      showMsg(msgSlot(key), "This console is not connected to OrcaSlicer, so nothing can be sent.");
      return;
    }
    beginWait(key, expect, show, label);
    bridge.call("command", assign({ name: name }, params)).then(function(){
      /* Accepted. The pending state stands until the printer itself agrees - the
         slicer polls immediately after a command, so that is usually one beat. */
    }, function(err){
      delete waiting[key];
      /* A parked page has no one reading it and no printer of its own any more. */
      if (!suspended) showMsg(msgSlot(key), String((err && err.message) || err));
      repaint();
    });
  }

  /* ══ What can act right now ═══════════════════════════════════════════
     Print speed is the one control with nothing to act on when no job is
     running, so it is the one that is disabled. Filtration and the Z offset
     both have real uses on an idle machine - clearing fumes after a print or
     during a filament purge, and setting an offset before one - so they are
     offered, attempted, and answered for: if the firmware quietly ignores
     the command the wait runs out and the page says the printer still
     reports its previous value. That is a better answer than a button which
     silently cannot be pressed.                                        */
  var OFF_REASON  = "The printer is not answering, so nothing can be sent to it.";
  var PARKED      = "This printer is not the selected one any more.";
  var SAMPLE_ONLY = "This page was opened outside OrcaSlicer, so there is no printer to talk to.";
  var JOB_ONLY    = "The printer applies this only while a job is running.";
  var NO_JOB      = "Nothing is printing.";

  function jobPhase(s){
    if (!s || !s.connected) return "none";
    var p = s.printer || {}, st = String(p.state || "").toLowerCase();
    if (st === "paused") return "paused";
    if (st === "printing") return "running";
    if ((st === "heating" || st === "busy") && p.print_file) return "running";
    return "none";
  }

  function setCtl(key, on, why, pressed, opts){
    var node = ctlNode(key);
    if (!node) return;
    opts = opts || {};
    var w   = waiting[opts.wait || key];
    var off = !!w || !on;
    if (node.disabled !== off) node.disabled = off;
    setAttr(node, "title", w ? "Waiting for the printer to confirm…" : (on ? (opts.title || "") : why));
    if (pressed !== undefined) setAttr(node, "aria-pressed", pressed ? "true" : "false");
    /* A grouped control (the speed segment, the Z stepper) pulses as one piece
       rather than lighting up each of its buttons. */
    if (!opts.grouped) setFlag(node, "data-pending", !!w);
  }

  var stopArmed = false, stopTimer = null, stopSafeUntil = 0;
  function disarmStop(){
    if (stopTimer){ clearTimeout(stopTimer); stopTimer = null; }
    if (!stopArmed) return;
    stopArmed = false;
    repaint();
  }
  /* Focus goes to Keep printing, and Yes stays dead for a moment: a button fires on Enter, so
     arming under a held or doubled Enter must not be able to cancel a print by itself. */
  function armStop(){
    stopArmed     = true;
    stopSafeUntil = Date.now() + STOP_SAFE_MS;
    if (stopTimer) clearTimeout(stopTimer);
    stopTimer = setTimeout(disarmStop, STOP_ARM_MS);
    repaint();
    var no = ctlNode("stop-no");
    if (no) no.focus();
    setTimeout(function(){ if (stopArmed) repaint(); }, STOP_SAFE_MS + 20);
  }

  function applyControls(s){
    if (!s || !ctlNode("light")) return;
    var p = s.printer || {}, raw = p.raw || {};
    var pro   = isPro(p);
    var phase = jobPhase(s);
    var busy  = phase !== "none";
    var live_ = !!bridge && !suspended && !!s.connected;
    var why   = !bridge ? SAMPLE_ONLY : suspended ? PARKED : !s.connected ? OFF_REASON : "";
    var jobWhy = live_ ? JOB_ONLY : why;

    setCtl("light", live_, why, expected("light", !!p.light_on));
    if (pro){
      setCtl("internal", live_, why, expected("internal", String(raw.internalFanStatus) === "open"));
      setCtl("external", live_, why, expected("external", String(raw.externalFanStatus) === "open"));
    }

    var speed = expected("speed", Math.round(num(raw.printSpeedAdjust)));
    SPEEDS.forEach(function(v){
      setCtl("speed-" + v, live_ && busy, jobWhy, v === speed, { wait: "speed", grouped: true });
    });
    setFlag(grpNode("speed"), "data-pending", !!waiting.speed);

    var z = expected("z", round3(raw.zAxisCompensation));
    /* Nothing to show an offset for until the printer has reported one. */
    setLive("z-value", (s.printer || waiting.z) ? zText(z) : "—");
    var zWhy = "The Z offset has to stay within ±" + Z_LIMIT.toFixed(3) + " mm.";
    setCtl("z-down", live_ && z - Z_STEP >= -Z_LIMIT, live_ ? zWhy : why, undefined, { wait: "z", grouped: true });
    setCtl("z-up",   live_ && z + Z_STEP <=  Z_LIMIT, live_ ? zWhy : why, undefined, { wait: "z", grouped: true });
    setFlag(grpNode("z"), "data-pending", !!waiting.z);

    setCtl("cool", live_, why);

    var resuming = phase === "paused";
    setHTML(document.querySelector('[data-ctl="job"] [data-ctl-icon]'), resuming ? ICON_PLAY : ICON_PAUSE);
    setText(document.querySelector('[data-ctl="job"] [data-ctl-label]'), resuming ? "Resume" : "Pause");
    setCtl("job", live_ && busy, live_ ? NO_JOB : why);

    var armed = stopArmed && live_ && busy;
    show(grpNode("stop-idle"), !armed);
    show(grpNode("stop-armed"), armed);
    setCtl("stop", live_ && busy, live_ ? NO_JOB : why, undefined, { wait: "job" });
    setCtl("stop-yes", live_ && busy && Date.now() >= stopSafeUntil, why, undefined, { wait: "job" });
    /* Only live while the confirmation is showing, so it is never the one thing on a parked or
       sample page that answers to a click. */
    setCtl("stop-no", armed, "");

    /* Targets are the one thing this machine will change whatever it is doing. */
    applyTempChip("temp-bed", "bed-target", live_, why);
    if (pro) applyTempChip("temp-chamber", "chamber-target", live_, why);
    var chips = document.querySelectorAll('[data-ctl^="temp-nozzle-"]');
    for (var i = 0; i < chips.length; i++){
      var tool = chips[i].getAttribute("data-ctl").slice(12);
      applyTempChip("temp-nozzle-" + tool, "nozzle-target-" + tool, live_, why);
    }
  }

  function applyTempChip(key, liveKey, on, why){
    var w = waiting[key];
    if (w && w.show !== undefined) setLiveTarget(liveKey, w.show);
    setCtl(key, on, why, undefined, { title: "Set this target" });
  }

  /* Everything outside a poll that changes what a control should look like. */
  function repaint(){
    if (!lastState) return;
    var p = lastState.printer;
    if (p) applyLive(p, p.raw || {});
    applyControls(lastState);
  }

  /* ══ The controls themselves ═════════════════════════════════════════ */

  function targetOf(s, key){
    var t = ((s && s.printer) || {}).temperatures || {};
    if (key === "temp-bed") return num((t.bed || {}).target);
    if (key === "temp-chamber") return num((t.chamber || {}).target);
    return num(((t.nozzles || [])[num(key.slice(12)) - 1] || {}).target);
  }
  function rawOf(s){ return (((s || {}).printer) || {}).raw || {}; }

  var TEMP_MAX = { "temp-bed": 150, "temp-chamber": 100, nozzle: 350 };
  function tempMax(key){ return TEMP_MAX[key] || TEMP_MAX.nozzle; }

  function onLight(s){
    var want = !expected("light", !!(s.printer || {}).light_on);
    command("light", "light", { on: want },
            function(st){ return !!((st.printer || {}).light_on) === want; },
            want, "The chamber light");
  }

  function onFan(s, key){
    var field = key === "internal" ? "internalFanStatus" : "externalFanStatus";
    var want  = expected(key, String(rawOf(s)[field]) === "open") ? "close" : "open";
    var params = {};
    params[key] = want;
    command(key, "filtration", params,
            function(st){ return String(rawOf(st)[field]) === want; },
            want === "open",
            key === "internal" ? "Recirculation" : "The exhaust fan");
  }

  function onSpeed(v){
    command("speed", "printer_ctl", { speed: v },
            function(st){ return Math.round(num(rawOf(st).printSpeedAdjust)) === v; },
            v, "Print speed");
  }

  function onZ(s, up){
    var target = round3(expected("z", round3(rawOf(s).zAxisCompensation)) + (up ? Z_STEP : -Z_STEP));
    if (Math.abs(target) > Z_LIMIT){
      showMsg("bar", "The Z offset has to stay within ±" + Z_LIMIT.toFixed(3) + " mm.");
      return;
    }
    command("z", "printer_ctl", { zAxisCompensation: target },
            function(st){ return round3(rawOf(st).zAxisCompensation) === target; },
            target, "The Z offset");
  }

  /* Every target to zero in one command, so nothing is left heating. A 0 here is
     an instruction to switch off, not the "leave this one alone" that an absent
     value means. */
  function onCoolDown(s){
    var p = s.printer || {};
    var count = ((p.temperatures || {}).nozzles || []).length || 4;
    var nozzles = [null, null, null, null];
    for (var i = 0; i < Math.min(count, 4); i++) nozzles[i] = 0;
    var params = { nozzles: nozzles, bed: 0 };
    var pro = isPro(p);
    if (pro) params.chamber = 0;

    /* A chip still waiting on its own target would otherwise sit there and then
       complain that the printer ignored it. Cooling down supersedes all of them. */
    for (var key in waiting)
      if (waiting.hasOwnProperty(key) && key.indexOf("temp-") === 0) delete waiting[key];

    command("cool", "temperature", params, function(st){
      var t = (st.printer || {}).temperatures || {};
      if (num((t.bed || {}).target) !== 0) return false;
      if (pro && num((t.chamber || {}).target) !== 0) return false;
      var nz = t.nozzles || [];
      for (var j = 0; j < nz.length; j++)
        if (num(nz[j].target) !== 0) return false;
      return true;
    }, undefined, "Cooling down");
  }

  function onJob(s){
    var resuming = jobPhase(s) === "paused";
    command("job", "job", { action: resuming ? "resume" : "pause" },
            function(st){ return jobPhase(st) === (resuming ? "running" : "paused"); },
            undefined, resuming ? "Resuming the print" : "Pausing the print");
  }

  function onStopConfirmed(){
    disarmStop();
    command("job", "job", { action: "stop" },
            function(st){ return jobPhase(st) === "none"; },
            undefined, "Stopping the print");
  }

  /* A target you type rather than a number you nudge: the chip becomes a field in
     place, Enter sends it and Escape leaves everything alone. The chip element is
     kept and put back, so applyLive keeps writing into the same live hole. */
  function openTempEditor(chip, key){
    var input = document.createElement("input");
    input.type      = "text";
    input.inputMode = "decimal";
    input.className = "tset-edit";
    input.value     = String(Math.round(expected(key, targetOf(lastState, key))));
    input.setAttribute("aria-label", (chip.getAttribute("data-live-label") || "Target") + " in degrees Celsius");
    chip.parentNode.replaceChild(input, chip);
    input.focus();
    input.select();

    var closed = false;
    function close(){
      if (closed) return;
      closed = true;
      if (input.parentNode) input.parentNode.replaceChild(chip, input);
      repaint();
    }
    input.addEventListener("keydown", function(ev){
      if (ev.key === "Escape" || ev.keyCode === 27){ ev.preventDefault(); close(); }
      else if (ev.key === "Enter" || ev.keyCode === 13){
        ev.preventDefault();
        var typed = input.value;
        close();
        commitTemp(key, typed);
      }
    });
    input.addEventListener("blur", close);
  }

  function commitTemp(key, typed){
    var max = tempMax(key);
    var v   = Number(String(typed).replace(",", ".").trim());
    if (String(typed).trim() === "" || !isFinite(v) || v < 0 || v > max){
      showMsg(key, "Enter a target between 0 and " + max + " °C.");
      return;
    }
    v = Math.round(v);

    var params = {}, label;
    if (key === "temp-bed"){ params.bed = v; label = "The bed target"; }
    else if (key === "temp-chamber"){ params.chamber = v; label = "The chamber target"; }
    else {
      var tool = num(key.slice(12));
      if (!(tool >= 1 && tool <= 4)){ showMsg(key, "Unknown toolhead."); return; }
      var arr = [null, null, null, null];
      arr[tool - 1] = v;
      params.nozzles = arr;
      label = "Tool " + tool + "'s target";
    }
    command(key, "temperature", params,
            function(st){ return Math.round(targetOf(st, key)) === v; },
            v, label);
  }

  /* ══ Match project to printer ═════════════════════════════════════════
     The station knows what is loaded; the project only knows what it was
     last told. When they disagree the slicer refuses to send (the material
     families do not line up) and the plate preview paints the part the
     wrong colour - so the page says so, in one line, with a button.

     Never a modal, and never automatic: rewriting someone's filament slots
     is their decision. Dismissing it remembers the exact wording, so the
     line comes back by itself if what disagrees changes.               */

  var suggestDismissed = "", matchBusy = false, matchMsgTimer = null;

  function suggestion(s){
    if (!bridge || suspended || !s || s.sample) return null;
    var m = s.project_match;
    return (m && m.summary) ? m : null;
  }

  function renderSuggestion(s){
    var m   = suggestion(s);
    var box = el("matchSuggest");
    if (!m || m.summary === suggestDismissed){ setHTML(box, ""); return; }
    /* Structure from the wording alone, so a poll that changes nothing leaves
       the button the same DOM node the pointer is already over. */
    setHTML(box,
      '<div class="suggest">' +
        '<span class="s-dot" aria-hidden="true"></span>' +
        '<span class="s-text">' + esc(m.summary) + '</span>' +
        '<button class="mini s-go" type="button" data-ctl="match">Match project to printer</button>' +
        '<button class="iconbtn s-x" type="button" data-ctl="match-dismiss" ' +
          'title="Dismiss. It comes back if what disagrees changes." aria-label="Dismiss">\u00D7</button>' +
      '</div>');
    applySuggestion();
  }

  function applySuggestion(){
    var go = document.querySelector('[data-ctl="match"]');
    if (!go) return;
    go.disabled = matchBusy;
    setFlag(go, "data-pending", matchBusy);
    setAttr(go, "title", matchBusy
      ? "Matching\u2026"
      : "Give each loaded slot the filament preset and colour the printer reports.");
  }

  /* Its own line, outside the suggestion box: the box disappears the moment the
     project agrees, and the result of the click has to outlive it. */
  function showMatchMsg(text, warn){
    var node = document.querySelector('[data-msg="match"]');
    if (!node) return;
    setText(node, text || "");
    setAttr(node, "data-kind", warn ? "warn" : "ok");
    if (matchMsgTimer) clearTimeout(matchMsgTimer);
    if (text) matchMsgTimer = setTimeout(function(){ setText(node, ""); }, MSG_MS);
  }

  function matchResultLine(res){
    var slots = (res && res.slots) || [], done = [], notes = [];
    for (var i = 0; i < slots.length; i++){
      var r = slots[i];
      if (r.changed) done.push("Slot " + r.slot + ": " + [r.preset_after, r.color_after].filter(Boolean).join(", "));
      else if (!r.matched) notes.push(r.reason);
    }
    var parts = [];
    if (done.length) parts.push(done.join(" \u00B7 ") + ".");
    if (notes.length) parts.push(notes.join(" "));
    if (!parts.length) parts.push("The project already matched the printer.");
    return { text: parts.join(" "), warn: notes.length > 0 };
  }

  function onMatch(){
    if (!bridge || suspended || matchBusy) return;
    matchBusy = true;
    showMatchMsg("", false);
    applySuggestion();
    bridge.call("command", { name: "match_project_to_printer" }).then(function(res){
      matchBusy = false;
      var line = matchResultLine(res);
      showMatchMsg(line.text, line.warn);
      /* The host pushes a fresh status right after, and the suggestion goes with
         it - or stays, if something could not be matched. Both are honest. */
      applySuggestion();
    }, function(err){
      matchBusy = false;
      if (!suspended) showMatchMsg(String((err && err.message) || err), true);
      applySuggestion();
    });
  }

  /* One listener for the whole page: the rail, the environment rows and the bar
     are all rebuilt from strings, and a listener bound to a button would go with
     it. Disabled buttons dispatch no click at all, and the guard says so anyway. */
  document.addEventListener("click", function(ev){
    var node = ev.target && ev.target.closest ? ev.target.closest("[data-ctl]") : null;
    if (!node || node.disabled || !lastState) return;
    var key = node.getAttribute("data-ctl");
    var s   = lastState;

    if (key === "light") onLight(s);
    else if (key === "internal" || key === "external") onFan(s, key);
    else if (key.indexOf("speed-") === 0) onSpeed(num(key.slice(6)));
    else if (key === "z-up" || key === "z-down") onZ(s, key === "z-up");
    else if (key === "cool") onCoolDown(s);
    else if (key === "job") onJob(s);
    else if (key === "stop") armStop();
    else if (key === "stop-yes") onStopConfirmed();
    else if (key === "stop-no") disarmStop();
    else if (key === "match") onMatch();
    else if (key === "match-dismiss"){
      var m = suggestion(s);
      suggestDismissed = (m && m.summary) || "";
      renderSuggestion(s);
    }
    else if (key.indexOf("temp-") === 0) openTempEditor(node, key);
  });

  /* Escape backs out of the stop confirmation, the same as clicking Keep printing. */
  document.addEventListener("keydown", function(ev){
    if ((ev.key === "Escape" || ev.keyCode === 27) && stopArmed) disarmStop();
  });

  function stat(label, value){ return '<div class="stat"><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>'; }

  function renderJob(s, p, raw, ms, printing){
    if (!s.connected){
      setHTML(el("jobCard"), '<h2 class="eyebrow" style="margin:0" id="jobHead">Current job</h2>'+
        '<div class="idle-big">'+(s.connecting ? "Connecting…" : "Unknown")+'</div>'+
        '<div class="job-title"><span class="s">'+
        (s.connecting ? "Reading the printer's status." : "No answer from the printer, so there is nothing to report.")+
        '</span></div>');
      return;
    }

    var slots = (pick(p, "material_station", {}).slots) || [];

    if (!printing){
      var st     = STATES[String(p.state || "unknown").toLowerCase()] || STATES.unknown;
      var loaded = slots.filter(function(x){ return x.has_filament; }).length;
      var stats    = stat("Status", st[1]);
      if (raw.cumulativePrintTime !== undefined) stats += stat("Lifetime printing", durMinutes(raw.cumulativePrintTime));
      if (raw.cumulativeFilament !== undefined)  stats += stat("Filament used", num(raw.cumulativeFilament).toFixed(1) + " m");
      if (slots.length) stats += stat("Material station", loaded + " of " + slots.length + " loaded");
      if (p.error_code) stats += stat("Error code", p.error_code);

      setHTML(el("jobCard"),
        '<h2 class="eyebrow" style="margin:0" id="jobHead">Current job</h2>'+
        '<div class="job-head"><div class="job-title">'+
          '<span class="idle-big">'+esc(st[1] === "Ready" ? "Idle — ready to print" : st[1])+'</span>'+
          '<span class="s">Nothing is printing. Slice a plate and send it from the Prepare tab.</span>'+
        '</div></div>'+
        '<dl class="job-stats">'+stats+'</dl>');
      return;
    }

    var pct    = Math.max(0, Math.min(100, num(p.progress) * 100));
    var layer  = num(raw.printLayer), total = num(raw.targetPrintLayer);
    var active = slotsById(p)[num(ms.currentSlot)] || {};
    var tint   = hex(active.color) || "var(--brass)";

    /* A progress ribbon, not a per-layer tool map: the API reports the layer
       count, not which tool laid which band, so nothing here is invented. */
    var bands = 96, done = Math.round(bands * pct / 100), ribbon = "";
    for (var i = 0; i < bands; i++)
      ribbon += '<i style="--c:'+tint+';height:'+(26 + ((i*37) % 17))+'px" data-done="'+(i < done ? 1 : 0)+'"></i>';

    var sub = [];
    if (total) sub.push("Layer " + layer.toLocaleString() + " of " + total.toLocaleString());
    if (num(raw.printSpeedAdjust)) sub.push(Math.round(num(raw.printSpeedAdjust)) + " % speed");

    setHTML(el("jobCard"),
      '<div class="job-head"><div class="job-title">'+
        '<h2 class="eyebrow" style="margin:0 0 4px" id="jobHead">Current job</h2>'+
        '<span class="n">'+esc(p.print_file || "Untitled job")+'</span>'+
        '<span class="s">'+esc(sub.join(" · "))+'</span></div>'+
        '<div class="job-pct mono">'+pct.toFixed(1)+'<sub>%</sub></div></div>'+
      '<div class="ribbon" role="img" aria-label="Progress ribbon: '+pct.toFixed(0)+' per cent complete">'+ribbon+'</div>'+
      '<dl class="job-stats">'+
        stat("Elapsed", dur(p.duration_s))+
        stat("Remaining", dur(p.remaining_s))+
        stat("Finishes", eta(p.remaining_s))+
        (total ? stat("Layer", layer.toLocaleString() + " / " + total.toLocaleString()) : "")+
        stat("Bed", t1((((p.temperatures)||{}).bed||{}).current) + " °C")+
        (p.error_code ? stat("Error code", p.error_code) : "")+
      '</dl>');
  }

  function renderFiles(){
    setHTML(el("fileList"),
      '<div class="nodata">Browsing and reprinting the files already stored on the printer is not part of '+
      'this console yet.</div>');
  }

  function renderFoot(s){
    var poll = num(s.poll_ms, 2000) / 1000;
    var where = s.sample ? "Sample data — no printer connected"
              : s.connected ? "Connected to " + (s.host || "the printer")
              : s.connecting ? "Connecting to " + (s.host || "the printer") + "…"
              : "Reconnecting…";
    setHTML(el("foot"),
      '<span>OrcaMCP · Flashforge console</span><span class="sep"></span>'+
      '<span class="mono">Polling the local API every '+poll+' s</span><span class="sep"></span>'+
      '<span>'+esc(where)+'</span><span class="sep"></span>'+
      '<span>Controls settle on what the printer confirms</span>');
  }

  /* ══ Theme ════════════════════════════════════════════════════════════
     Follows OrcaSlicer until the user overrides it here.               */
  var themeLocked = false;
  function applyTheme(s){
    if (themeLocked || typeof s.app_dark !== "boolean") return;
    document.documentElement.setAttribute("data-theme", s.app_dark ? "dark" : "light");
  }
  el("timelapseBtn").setAttribute("title", NO_TIMELAPSE);

  el("themeBtn").addEventListener("click", function(){
    themeLocked = true;
    var cur  = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* ══ One render pass ══════════════════════════════════════════════════ */
  /* Which machine this is does not change when the network hiccups. Remembering it keeps the
     Environment panel's shape - and therefore its markup - stable across a blip, so the rows do
     not tear down and rebuild empty. */
  var knownPro = false;
  function isPro(p){
    if (num(p.pid) > 0) knownPro = num(p.pid) === 41;
    return knownPro;
  }

  function render(s){
    lastState = s;
    var p   = s.printer || {};
    var raw = p.raw || {};
    var ms  = raw.matlStationInfo || {};
    var pro = isPro(p);
    var state = String(p.state || "").toLowerCase();
    var printing = s.connected && (state === "printing" || state === "paused" ||
                                   (state === "heating" && !!p.print_file));

    applyTheme(s);
    renderIdentity(s, p);
    renderBanner(s);
    renderMachine(p, raw, pro);
    renderTools(p, raw, ms);
    applyToolCards(s.printer, raw, ms, printing);
    renderSuggestion(s);
    renderEnvironment(pro);
    renderCamera(s, p, raw, pro, printing);
    renderControls(pro);
    renderJob(s, p, raw, ms, printing);
    renderFiles();
    applyLive(s.printer, raw);
    /* Last, so a control still waiting on the printer keeps showing what was asked
       for rather than the value applyLive just wrote under it. */
    applyControls(s);
    renderFoot(s);

    // data-ready freezes the tool cards' staggered entrance. Setting it in the
    // same frame as the first paint cancels the animation before it runs, so it
    // waits for the last card's delay + duration to elapse.
    if (s.printer && !document.body.getAttribute("data-ready") && !markingReady){
      markingReady = true;
      setTimeout(function(){ document.body.setAttribute("data-ready", "1"); }, 900);
    }
  }

  var markingReady = false;

  /* ══ Watchdog ═════════════════════════════════════════════════════════
     The slicer's poller can stop without the page knowing - the printer was
     deselected, or it never started because the preset had no host yet. One
     `status` restarts it, so the page asks again whenever the pushes go quiet
     for three cadences. Recovery never needs a restart of anything.      */
  var lastStatusAt = Date.now(), lastPollMs = 5000, suspended = false;
  /* The Page Visibility API only gets to silence the watchdog once it has said
     "visible" at least once - an embedded web view that reports hidden for ever
     must not be able to leave the page with stale data nobody refreshes. */
  var everVisible = (typeof document.hidden === "boolean") ? !document.hidden : true;

  function askNow(){
    if (bridge && !suspended) bridge.call("status").then(onStatus, function(){ /* the next tick tries again */ });
  }

  function onStatus(s){
    lastStatusAt = Date.now();
    lastPollMs   = num((s && s.poll_ms), 5000);
    s = s || { connected:false, error:"Empty status" };
    /* Before painting: every control still waiting either gets what it asked for
       or, once the wait is up, says so and settles on what the printer reports. */
    settleWaits(s);
    if (jobPhase(s) === "none") disarmStop();
    render(s);
  }

  setInterval(function(){
    // Parked, or nobody is looking: the host pushes when it has something to say,
    // and a page that keeps asking anyway is a page that undoes its own suspend.
    if (!bridge || suspended || (everVisible && document.hidden)) return;
    if (Date.now() - lastStatusAt > Math.max(8000, lastPollMs * 3))
      askNow();
  }, 2000);

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) return;
    everVisible = true;
    askNow();
  });

  /* ══ Start ════════════════════════════════════════════════════════════
     window.wx is installed by the host just after the web view is created,
     which can land a moment after this document starts running. So a
     missing bridge is treated as "not yet" for a couple of seconds before
     it is taken to mean "opened in a browser".                          */
  function start(){
    render({ connected:false, connecting:true });
    bridge.call("status").then(onStatus, function(e){
      onStatus({ connected:false, error:String((e && e.message) || e) });
    });
  }

  /* OrcaSlicer stamps its own user agent on every web view it creates, so the
     page can tell "the host is still wiring up the bridge" from "this file was
     opened in a browser" - and never shows sample figures inside the app. */
  var inApp = /BBL-Slicer/.test(navigator.userAgent);

  if (bridge){
    start();
  } else {
    render({ connected:false, connecting:true });
    var waited = 0;
    var wait = setInterval(function(){
      if (window.wx && typeof window.wx.postMessage === "function"){
        clearInterval(wait);
        bridge = makeBridge();
        start();
        return;
      }
      waited += 250;
      if (!inApp && waited >= 1500){
        clearInterval(wait);
        render(SAMPLE);
      }
    }, 250);
  }
})();
</script>
